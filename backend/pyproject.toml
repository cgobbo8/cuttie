[project]
name = "cuttie-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.135.2",
    "librosa>=0.11.0",
    "numpy>=2.2.6",
    "openai>=2.29.0",
    "python-dotenv>=1.2.2",
    "requests>=2.32.0",
    "python-multipart>=0.0.22",
    "scipy>=1.15.3",
    "soundfile>=0.13.1",
    "uvicorn[standard]>=0.42.0",
    "yt-dlp>=2026.3.17",
    "torch>=2.11.0",
    "torchaudio>=2.11.0",
    # Pulled by ultralytics; listed so Windows takes the CUDA build with torch (below)
    "torchvision>=0.26.0",
    "panns-inference>=0.1.1",
    "opencv-python-headless>=4.13.0.92",
    "ultralytics>=8.4.33",
    "faster-whisper>=1.1",
    "mlx-whisper>=0.4 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "watchdog>=6.0.0",
]

# Windows: the CUDA 12.6 builds of PyTorch (PyPI only has CPU ones there), for the
# NVIDIA GPU; their cuBLAS / cuDNN DLLs also serve faster-whisper (transcriber._cuda_dlls)
[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32'" }]
torchaudio = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32'" }]

[tool.uv]
# Same versions on every platform: torchaudio and torchvision are built for one torch
constraint-dependencies = ["torch==2.11.0", "torchaudio==2.11.0", "torchvision==0.26.0"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
